<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Central Icon (JXL Layer Graphic) -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Bottom layer -->
    <path d="M-130 50 L0 105 L130 50 L0 -5 Z" fill="#bae6fd" opacity="0.6" />
    <!-- Middle layer -->
    <path d="M-130 0 L0 55 L130 0 L0 -55 Z" fill="#7dd3fc" opacity="0.85" />
    <!-- Top layer -->
    <path d="M-130 -50 L0 5 L130 -50 L0 -105 Z" fill="url(#box-grad)" />
  </g>

  <!-- JXL Text Badge -->
  <g transform="translate(256, 420)">
    <rect x="-100" y="-36" width="200" height="60" rx="18" fill="#0f172a" opacity="0.85" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#38bdf8" text-anchor="middle" letter-spacing="4">JXL</text>
  </g>
</svg>
